[package]
name = "panel"
version = "0.1.0"
edition = "2024"
description = "Web panel that runs and controls Minecraft Java servers (Vanilla, Paper, Fabric)"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crc32fast = "1"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
md-5 = "0.10"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
sysinfo = { version = "0.37", default-features = false, features = ["system", "network"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
ureq = { version = "3", features = ["json"] }
url = "2"
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
