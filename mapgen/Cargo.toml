[package]
name = "mapgen"
version = "0.1.0"
edition = "2024"
description = "Lightweight Minecraft map renderer (map-item style) for the server panel"
license = "MIT"
publish = false

[dependencies]
fastnbt = "2.6"
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
png = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
