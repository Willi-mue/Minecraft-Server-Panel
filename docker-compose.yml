services:
  panel:
    build:
      context: .
      args:
        # Extra Java runtimes besides 25; add 17 / 8 only if you play old versions
        EXTRA_JAVA: ${EXTRA_JAVA:-21}
    image: minecraft-server-panel
    pull_policy: build   # always build locally, never try to pull this image from a registry
    container_name: minecraft-server-panel
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # BACKUP_DIR in .env is a folder on the host; inside the container it is always mounted here.
      # (`environment` overrides the value from env_file.)
      BACKUP_DIR: /data/backups
      TZ: ${TZ:-UTC}
    ports:
      - "${WEB_PORT_HOST:-47318}:47318"   # web panel (admin)
      - "${MC_PORT_HOST:-25565}:25565"    # Minecraft (first server)
      - "25566-25569:25566-25569"         # Minecraft: additional servers (SERVER_PORTS)
      - "${MAP_PORT_HOST:-47319}:47319"   # live map (share with players)
    volumes:
      - ./data:/data
      - type: bind
        source: ${BACKUP_DIR:-./data/backups}   # empty BACKUP_DIR = default location
        target: /data/backups
        bind:
          create_host_path: true
    # Give the Minecraft server time to save the world on `docker compose down`
    stop_grace_period: 90s
